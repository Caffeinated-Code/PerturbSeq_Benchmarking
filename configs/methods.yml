methods:
  - id: native_paper
    name: Paper-native analysis
    year: dataset_specific
    category: baseline
    enabled: true
    output_level: dataset_specific

  - id: transparent_pseudobulk
    name: Transparent replicate-pseudobulk baseline
    year: baseline
    category: baseline
    enabled: true
    output_level: perturbation_gene
    version: builtin-1
    compatibility: RNA or targeted RNA; non-targeting controls; replicate/batch metadata recommended

  - id: sceptre_low_moi
    name: SCEPTRE low-MOI
    year: 2024
    category: association_testing
    enabled: false
    output_level: perturbation_gene
    source: https://pmc.ncbi.nlm.nih.gov/articles/PMC11100084/
    version: 21f9ea098b69c444a884a49bc254de711968e3b5
    compatibility: low-MOI RNA only; distinct from high/mixed-MOI analysis

  - id: sceptre_high_moi_or_mixed_moi
    name: SCEPTRE high-MOI or mixed-MOI workflow
    year: 2024
    category: association_testing
    enabled: false
    output_level: perturbation_gene
    source: https://pmc.ncbi.nlm.nih.gov/articles/PMC11100084/
    version: 21f9ea098b69c444a884a49bc254de711968e3b5
    compatibility: high/mixed-MOI RNA with guide assignments and covariates

  - id: ps
    name: Perturbation-response score
    year: 2025
    category: response_scoring
    enabled: false
    output_level: cell_and_perturbation
    source: https://www.nature.com/articles/s41556-025-01626-9
    version: e24aa0f3c9734c26ffbc200107adf0e199b26208
    compatibility: RNA response signature with non-targeting controls; scMAGeCK API

  - id: gsfa
    name: Guided sparse factor analysis
    year: 2023
    category: latent_factor
    enabled: false
    output_level: perturbation_module
    source: https://www.nature.com/articles/s41592-023-02017-4
    version: 8e7cf03fdeeb008ef7dec7b6bc6407642d14376e
    compatibility: whole-transcriptome normalized RNA and multi-perturbation design

  - id: mixscape
    name: Mixscape
    year: 2021
    category: perturbation_classification
    enabled: false
    output_level: cell_and_guide
    source: https://satijalab.org/seurat/reference/runmixscape
    version: 5.3.0
    compatibility: whole-transcriptome RNA with non-targeting cells and sufficient DE features

  - id: pertpy_distance
    name: pertpy perturbation-distance workflow
    year: 2025
    category: framework
    enabled: false
    output_level: perturbation_embedding
    source: https://www.nature.com/articles/s41592-025-02909-7
    version: 0.10.0
    compatibility: Python 3.10-3.12; AnnData-compatible RNA groups

  - id: signac_archr_chromvar_track
    name: Signac, ArchR, and chromVAR regulatory validation
    year: active
    category: chromatin_accessibility
    enabled: false
    output_level: peak_gene_motif
