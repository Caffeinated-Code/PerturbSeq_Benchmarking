benchmark:
  min_cells_per_guide: 20
  min_cells_per_target: 50
  max_mito_fraction: 0.20
  min_genes_per_cell: 200
  target_gene_knockdown_log2fc_threshold: -0.25
  target_gene_activation_log2fc_threshold: 0.25
  fdr_threshold: 0.05
  downsampling_fractions: [1.0, 0.5, 0.25]

regulatory_validation:
  min_peak_detection_fraction: 0.05
  min_peak_to_gene_score: 0.20
  promoter_window_bp: 2000
  enhancer_window_bp: 100000
  motif_score_threshold: 0.50
  validation_score_pass: 70
  validation_score_warn: 40
  required_evidence_types:
    - accessible_peak
    - peak_to_gene_link
    - microglia_or_ad_annotation

biology:
  alzheimer_genes:
    - TREM2
    - APOE
    - BIN1
    - PICALM
    - INPP5D
    - CD33
    - ABCA7
    - CR1
    - SORL1
  microglia_identity:
    - P2RY12
    - CX3CR1
    - TMEM119
    - CSF1R
    - SPI1
  disease_state:
    - SPP1
    - CST7
    - LPL
    - APOE
    - CLEC7A
    - CD9
  interferon:
    - ISG15
    - IFIT1
    - IFIT2
    - IFI6
    - MX1
  antigen_presentation:
    - HLA-DRA
    - HLA-DRB1
    - CD74
  microglia_tf_motifs:
    - SPI1
    - IRF8
    - MAFB
    - RUNX1
    - CEBPB
    - MEF2C
