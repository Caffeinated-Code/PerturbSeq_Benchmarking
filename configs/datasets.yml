datasets:
  - id: demo_synthetic
    name: Synthetic Perturb-seq demo
    organism: human
    cell_type: microglia_like_demo
    perturbation_type: CRISPRi
    readout: scRNA-seq
    modality: RNA
    access: generated
    path: demo_data/demo_synthetic.h5ad
    priority: demo
    native_analysis: simple_pseudobulk_baseline

  - id: drager_microglia_cropseq
    name: Drager et al. iPSC-derived microglia CROP-seq
    organism: human
    cell_type: iPSC-derived microglia
    perturbation_type: CRISPRi
    readout: scRNA-seq plus sgRNA
    modality: RNA
    access: public
    source: https://www.nature.com/articles/s41593-022-01131-4
    priority: tier1
    native_analysis: lane_stratified_expression_state_baseline
    notes: Expression and microglial-state context only; deposited matrices lack consensus cell-to-guide assignments.

  - id: yang_ad_microglia_hyprseq
    name: Yang/Shen AD microglia CRISPRi-HyPr-seq
    organism: human
    cell_type: microglia
    perturbation_type: CRISPRi regulatory elements
    readout: targeted HyPr-seq
    modality: targeted_RNA
    access: public
    accession: GSE207628
    source: https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE207628
    priority: tier1
    native_analysis: targeted_panel_replicate_baseline
    notes: Targeted AD-locus context only; deposited matrices lack the cell-to-guide or cCRE mapping.

  - id: replogle_k562_gwps
    name: Replogle et al. K562 genome-scale Perturb-seq
    organism: human
    cell_type: K562
    perturbation_type: CRISPRi
    readout: scRNA-seq plus direct guide capture
    modality: RNA
    access: public
    source: https://plus.figshare.com/articles/dataset/_Mapping_information-rich_genotype-phenotype_landscapes_with_genome-scale_Perturb-seq_Replogle_et_al_2022_processed_Perturb-seq_datasets/20029387
    priority: tier1
    native_analysis: author_pseudobulk_qc_and_effect_audit
    notes: Perturbation-labeled guide-pair pseudobulk; cell-level methods require the larger source object.
