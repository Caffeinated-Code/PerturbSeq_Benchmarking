schema_name: perturbseq_benchmark_anndata
version: 1.0.0

required:
  obs:
    - cell_id
    - dataset_id
    - perturbation
    - guide_id
    - target_gene
    - control_type
    - batch
  var:
    - gene_id
    - gene_symbol
  layers:
    - counts

recommended:
  obs:
    - donor
    - condition
    - stimulation
    - cell_type
    - cell_state
    - guide_count
    - observation_type
    - n_genes
    - total_counts
    - pct_mito
  var:
    - chromosome
    - feature_type
  obsm:
    - X_pca
    - X_umap
    - protein
  uns:
    - dataset_source
    - publication
    - benchmark_notes

regulatory_validation:
  peak_table:
    required:
      - peak_id
      - chromosome
      - start
      - end
      - linked_gene
      - cell_type
      - accessibility_score
  peak_to_gene_table:
    required:
      - peak_id
      - gene_symbol
      - link_score
      - evidence_type
  motif_table:
    required:
      - peak_id
      - motif
      - motif_score
  variant_overlap_table:
    recommended:
      - peak_id
      - variant_id
      - locus
      - disease

control_type_values:
  - non_targeting
  - targeting
  - positive_control
  - safe_targeting
  - unknown

observation_type_values:
  - cell
  - guide_pair_pseudobulk

missingness_policy:
  perturbation: "Use unknown when a source archive lacks a validated cell-to-guide assignment."
  guide_id: "Use unknown; experimental MOI is not evidence of a per-cell guide call."
  donor: "Preserve donor or cell-line identity; never synthesize donor labels."
